name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: No committed secrets
        # Bun runs the TypeScript script directly (locally: npm run check:secrets).
        run: bun scripts/check-secrets.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Formatting
        run: bun run format:check
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build

  e2e:
    # Browser tests against the dev server (see docs/testing.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        run: bun run test:e2e
      - name: Keep the report if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
